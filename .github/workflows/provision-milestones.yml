name: Provision native milestones (one-time)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/provision-milestones.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: faysk-lab-native-milestones
  cancel-in-progress: false

jobs:
  provision:
    if: github.repository == 'Faysk/faysk-lab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current repository
        uses: actions/checkout@v4
      - name: Validate script syntax
        run: python3 -m py_compile scripts/provision_milestones.py
      - name: Create and associate native GitHub milestones
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/provision_milestones.py
